<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:fragment="title">Library</title>
    <style th:fragment="styles">
        body { font-family: Arial, sans-serif; margin: 20px; }
        nav { background: #f0f0f0; padding: 10px; margin-bottom: 20px; }
        nav a { margin-right: 15px; text-decoration: none; color: #333; }
        nav a:hover { text-decoration: underline; }
        table { border-collapse: collapse; width: 100%; max-width: 900px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #eee; }
        .actions form { display: inline; }
        .actions a, .actions button { margin-right: 5px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input[type=text], select { padding: 5px; min-width: 250px; }
        .errors { color: red; margin-top: 5px; }
        .btn { padding: 5px 10px; cursor: pointer; }
        .btn-danger { background: #d9534f; color: white; border: none; }
        .btn-primary { background: #337ab7; color: white; border: none; }
    </style>
</head>
<body>
<nav th:fragment="nav">
    <a th:href="@{/books}">Home (Books)</a>
    <a th:href="@{/authors}">Authors</a>
    <a th:href="@{/genres}">Genres</a>
</nav>
</body>
</html>
