spring:
  datasource:
    url: jdbc:h2:mem:testdb
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
      schema-locations: classpath:schema.sql
  jpa:
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - ru.otus.hw.exceptions.EntityNotFoundException
    instances:
      authorService:
        base-config: default
      genreService:
        base-config: default
      bookService:
        base-config: default
      commentService:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 50ms
        ignore-exceptions:
          - ru.otus.hw.exceptions.EntityNotFoundException
    instances:
      authorService:
        base-config: default
      genreService:
        base-config: default
      bookService:
        base-config: default
      commentService:
        base-config: default
