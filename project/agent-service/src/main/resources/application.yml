spring:
  application:
    name: agent-service

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

iw:
  agent:
    gateway-url: ${GATEWAY_URL:http://localhost:8080}
    enrollment-token: ${ENROLLMENT_TOKEN:}
    pull:
      interval: ${PULL_INTERVAL:30s}
      jitter: ${PULL_JITTER:5s}

resilience4j:
  circuitbreaker:
    instances:
      controlPlane:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      controlPlane:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  timelimiter:
    instances:
      controlPlane:
        timeout-duration: 40s

logging:
  level:
    ru.inversion.wharf: DEBUG
