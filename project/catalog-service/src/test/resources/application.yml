spring:
  application:
    name: catalog-service
  cloud:
    config:
      enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9/jwks
  kafka:
    bootstrap-servers: localhost:9092

eureka:
  client:
    enabled: false

iw:
  catalog:
    license-service-url: http://localhost:8083
  audit:
    topic: audit
