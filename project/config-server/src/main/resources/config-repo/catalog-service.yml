server:
  port: 8082

spring:
  r2dbc:
    url: r2dbc:postgresql://${POSTGRES_HOST:localhost}:5432/iw_catalog
    username: iw
    password: iw
    pool:
      initial-size: 5
      max-size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/iw_catalog
    user: iw
    password: iw
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/api/v1/auth/.well-known/jwks.json}

iw:
  catalog:
    license-service-url: lb://license-service
