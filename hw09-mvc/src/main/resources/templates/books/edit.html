<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${book.id == 0} ? 'New book' : 'Edit book'">Edit book</title>
    <style th:replace="~{fragments/layout :: styles}"></style>
</head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<h1 th:text="${book.id == 0} ? 'New book' : 'Edit book'">Edit book</h1>

<form th:action="${book.id == 0} ? @{/books} : @{'/books/' + ${book.id} + '/edit'}"
      th:object="${book}" method="post">

    <label for="title">Title</label>
    <input type="text" id="title" th:field="*{title}"/>
    <div class="errors" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>

    <label for="authorId">Author</label>
    <select id="authorId" th:field="*{authorId}">
        <option value="" th:selected="${book.authorId == null}">-- select author --</option>
        <option th:each="a : ${authors}"
                th:value="${a.id}"
                th:text="${a.fullName}"></option>
    </select>
    <div class="errors" th:if="${#fields.hasErrors('authorId')}" th:errors="*{authorId}"></div>

    <label for="genreIds">Genres</label>
    <select id="genreIds" th:field="*{genreIds}" multiple size="6">
        <option th:each="g : ${genres}"
                th:value="${g.id}"
                th:text="${g.name}"></option>
    </select>
    <div class="errors" th:if="${#fields.hasErrors('genreIds')}" th:errors="*{genreIds}"></div>

    <p>
        <button class="btn btn-primary" type="submit">Save</button>
        <a th:href="@{/books}">Cancel</a>
    </p>
</form>
</body>
</html>
