services:
  postgres:
    image: postgres:16-alpine
    container_name: hw17-postgres
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hw17-net

  app:
    build: .
    image: hw17-docker:latest
    container_name: hw17-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/library
      SPRING_DATASOURCE_USERNAME: library
      SPRING_DATASOURCE_PASSWORD: library
    ports:
      - "8080:8080"
    networks:
      - hw17-net

volumes:
  pgdata:

networks:
  hw17-net:
    driver: bridge
